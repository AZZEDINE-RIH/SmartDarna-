<div class="auth-container">
  <div class="auth-wrapper" [class.flipped]="isFlipped()">
    <!-- Login Side -->
    <div class="auth-card login-side">
      <div class="form-content">
        <h1>Login</h1>

        <form (ngSubmit)="onLogin()" class="auth-form">
          <div class="form-group">
            <input
              type="email"
              id="email"
              [(ngModel)]="email"
              name="email"
              placeholder="Username"
              required
              class="input-field"
            />
           
          </div>

          <div class="form-group">
            <input
              type="password"
              id="password"
              [(ngModel)]="password"
              name="password"
              placeholder="Password"
              required
              class="input-field"
            />
            
          </div>

          @if (errorMessage()) {
            <div class="error-message">{{ errorMessage() }}</div>
          }

          <button type="submit" [disabled]="isLoading()" class="auth-btn">
            @if (isLoading()) {
              <span>Logging in...</span>
            } @else {
              <span>Login</span>
            }
          </button>
        </form>

        <div class="signup-link">
          <p>Don't have an account? <a (click)="toggleFlip()">Sign Up</a></p>
        </div>
      </div>
    </div>

    <!-- Welcome Side -->
    <div class="auth-card welcome-side">
      <div class="welcome-content">
        <h2>WELCOME<br />BACK!</h2>
      </div>
    </div>
  </div>
</div>
