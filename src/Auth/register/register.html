<div class="auth-container">
  <div class="auth-wrapper" [class.flipped]="isFlipped()">
    <!-- Register Side -->
    <div class="auth-card register-side">
      <div class="form-content">
        <h1>Register</h1>

        <form (ngSubmit)="onRegister()" class="auth-form">
          <div class="form-group">
            <input
              type="text"
              id="name"
              
              [(ngModel)]="name"
              name="name"
              placeholder="Full Name"
              required
              class="input-field"
            />
           
          </div>

          <div class="form-group">
            <input
              type="email"
              id="email"
              [(ngModel)]="email"
              name="email"
              placeholder="Email"
              required
              class="input-field"
            />
            
          </div>

          <div class="form-group">
            <input
              type="password"
              id="password"
              [(ngModel)]="password"
              name="password"
              placeholder="Password"
              required
              class="input-field"
            />
           
          </div>

          <div class="form-group">
            <input
              type="password"
              id="passwordConfirm"
              [(ngModel)]="passwordConfirm"
              name="passwordConfirm"
              placeholder="Confirm Password"
              required
              class="input-field"
            />
            
          </div>

          @if (errorMessage()) {
            <div class="error-message">{{ errorMessage() }}</div>
          }

          <button type="submit" [disabled]="isLoading()" class="auth-btn">
            @if (isLoading()) {
              <span>Creating Account...</span>
            } @else {
              <span>Sign Up</span>
            }
          </button>
        </form>

        <div class="signup-link">
          <p>Already have an account? <a (click)="toggleFlip()">Log In</a></p>
        </div>
      </div>
    </div>

    <!-- Welcome Side -->
    <div class="auth-card welcome-side">
      <div class="welcome-content">
        <h2>JOIN US<br />TODAY!</h2>
      </div>
    </div>
  </div>
</div>
