<section class="brand-carousel-section">
  <div class="brand-carousel-wrapper" (mouseenter)="isPaused.set(true)" (mouseleave)="isPaused.set(false)">
    <div class="brand-carousel-mask">
      <div class="brand-carousel-track" [class.paused]="isPaused()">
        @for (brand of brands(); track brand.name) {
          <a class="brand-logo" href="#" (click)="$event.preventDefault()" [attr.aria-label]="brand.name">
            <img [src]="brand.logo" [alt]="brand.name" loading="lazy" />
          </a>
        }
        @for (brand of brands(); track 'dup-' + brand.name) {
          <a class="brand-logo" href="#" (click)="$event.preventDefault()" [attr.aria-label]="brand.name">
            <img [src]="brand.logo" [alt]="brand.name" loading="lazy" />
          </a>
        }
      </div>
    </div>
  </div>
</section>
