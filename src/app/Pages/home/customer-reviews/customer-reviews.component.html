<section class="reviews-section" id="reviews">
    <div class="container">
        <!-- Section Header -->
        <div class="section-header text-center fade-up">
            <span class="testimonials-label">Testimonials</span>
            <h2 class="section-title">What Our Customers Say</h2>
            <p class="subtitle">Trusted by thousands of smart home users worldwide.</p>
        </div>

        <!-- Reviews Grid -->
        <div class="reviews-grid">
            <div class="review-card card" *ngFor="let review of reviews.slice(0, 3)">
                <!-- Top Row: Avatar + Name/Location -->
                <div class="card-header">
                    <div class="user-meta">
                        <img [src]="review.avatar" [alt]="review.name" class="user-avatar">
                        <div class="user-info">
                            <h4 class="user-name">{{ review.name }}</h4>
                            <span class="user-location" *ngIf="review.location">{{ review.location }}</span>
                        </div>
                    </div>
                </div>

                <!-- Middle: Review Text -->
                <div class="card-body">
                    <p class="review-text">{{ review.text }}</p>
                </div>

                <!-- Bottom: Rating + Date -->
                <div class="card-footer">
                    <div class="rating">
                        <span class="star" *ngFor="let star of getRatingStars(review.rating)">★</span>
                        <span class="star empty" *ngFor="let star of getRatingStars(5 - review.rating)">★</span>
                    </div>
                    <span class="review-date" *ngIf="review.date">{{ review.date }}</span>
                </div>
            </div>
        </div>

        <!-- Write a Review Section -->
        <div class="review-actions text-center">
            <button class="btn main" (click)="toggleForm()">Write a Review</button>
        </div>

        <!-- Review Modal -->
        <div class="modal-overlay" *ngIf="showForm" (click)="toggleForm()">
            <div class="modal-container" (click)="$event.stopPropagation()">
                <button class="modal-close" (click)="toggleForm()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6L6 18M6 6l12 12" />
                    </svg>
                </button>

                <h3 class="modal-title">Write a Review</h3>
                <p class="modal-subtitle">Share your experience with the SmartDarna community.</p>

                <form (ngSubmit)="submitReview()" class="review-form">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" name="name" [(ngModel)]="newReview.name"
                            placeholder="Enter your full name" required>
                    </div>

                    <div class="form-group">
                        <label for="city">City (Optional)</label>
                        <input type="text" id="city" name="location" [(ngModel)]="newReview.location"
                            placeholder="e.g. Casablanca">
                    </div>

                    <div class="form-group">
                        <label>Star Rating</label>
                        <div class="rating-selector">
                            <span *ngFor="let s of [1,2,3,4,5]" class="star-btn" [class.active]="s <= newReview.rating"
                                (click)="newReview.rating = s">★</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="review-text">Your Review</label>
                        <textarea id="review-text" name="text" [(ngModel)]="newReview.text"
                            placeholder="Write your review here..." rows="4" required maxlength="500"></textarea>
                    </div>

                    <div class="modal-footer">
                        <button type="submit" class="btn main w-full">Post Review</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
