<section class="best-sellers section" id="best-sellers">
    <div class="container">
        <div class="section-header text-center slide-up">
            <h2 class="section-title">Best Sellers</h2>
            <p class="subtitle">Our most loved smart home products</p>
        </div>

        <app-carousel class="best-sellers-carousel"
            [items]="bestSellers"
            [autoplay]="true"
            [autoplayDelayMs]="3200"
            [pauseOnHover]="true"
            [showArrows]="true"
            [showDots]="true"
            [perViewDesktop]="4"
            [perViewTablet]="2"
            [perViewMobile]="1"
            [gapPx]="24">
            <ng-template let-product>
                <div class="product-slide">
                    <app-product-card [product]="product" [showBadge]="true" (addToCart)="onAddToCart($event)">
                    </app-product-card>
                </div>
            </ng-template>
        </app-carousel>
    </div>
</section>
