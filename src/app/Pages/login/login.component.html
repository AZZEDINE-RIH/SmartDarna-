<div class="login-page fade-in">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1 class="logo-text">Smart<span class="logo-accent">D</span>arna</h1>
                <p class="subtitle">Welcome back! Please login to continue.</p>
            </div>

            <form (ngSubmit)="onSubmit()" class="login-form">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" [(ngModel)]="email" name="email" placeholder="name@example.com" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" [(ngModel)]="password" name="password" placeholder="••••••••" required>
                </div>

                <div class="form-footer">
                    <a href="#" class="forgot-link">Forgot Password?</a>
                </div>

                <div class="error-message" *ngIf="error">
                    {{ error }}
                </div>

                <button type="submit" class="btn main w-full" [disabled]="isLoading">
                    <span *ngIf="!isLoading">Sign In</span>
                    <div class="spinner-small" *ngIf="isLoading"></div>
                </button>
            </form>

            <div class="login-footer">
                <p>New to SmartDarna? <a routerLink="/register" class="text-primary">Create Account</a></p>
                <a routerLink="/" class="back-link">Back to Home</a>
            </div>
        </div>
    </div>
</div>
