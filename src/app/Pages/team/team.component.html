<section class="team-page">
  <div class="team-header">
    <span class="pill">Team</span>
    <h1 class="title">Meet the <span class="accent">Organization</span></h1>
    <p class="subtitle">A clean, premium org chart with clear hierarchy.</p>
  </div>

  <div class="org-chart">
    <div class="director-row">
      <div class="person">
        <app-team-card [person]="director" size="director"></app-team-card>
      </div>
    </div>

    <div class="managers-area">
      <div class="manager-group" *ngFor="let group of managerGroups; let i = index" [class.group-1]="i === 0" [class.group-2]="i === 1" [class.group-3]="i === 2">
        <div class="person manager">
          <app-team-card [person]="group.manager" size="manager"></app-team-card>
        </div>

        <div class="members" [class.layout-row-2]="i === 0 || i === 2" [class.layout-grid-2x2]="i === 1">
          <div class="member" *ngFor="let m of group.members">
            <app-team-card [person]="m" size="member"></app-team-card>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
