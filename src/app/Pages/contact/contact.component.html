<div class="contact-page fade-in">
    <div class="container">
        <!-- Header Section -->
        <header class="contact-header text-center slide-up">
            <h1 class="section-title">Get in <span class="text-primary">Touch</span></h1>
            <p class="subtitle">We’re here to help you build a smarter home</p>
        </header>

        <div class="contact-grid">
            <!-- Contact Info & Map Column -->
            <aside class="contact-info-column slide-right">
                <div class="info-card card stagger-1">
                    <div class="icon-circle">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path
                                d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" />
                        </svg>
                    </div>
                    <div class="info-text">
                        <h4>Phone</h4>
                        <p>+212 6 00 00 00 00</p>
                    </div>
                </div>

                <div class="info-card card stagger-2">
                    <div class="icon-circle">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                            <polyline points="22,6 12,13 2,6" />
                        </svg>
                    </div>
                    <div class="info-text">
                        <h4>Email</h4>
                        <p>hello@smartdarna.com</p>
                    </div>
                </div>

                <div class="info-card card stagger-3">
                    <div class="icon-circle">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
                            <circle cx="12" cy="10" r="3" />
                        </svg>
                    </div>
                    <div class="info-text">
                        <h4>Location</h4>
                        <p>123 Smart tech St, Casablanca, Morocco</p>
                    </div>
                </div>

                <!-- Optional Map Section -->
                <div class="map-container card stagger-4">
                    <div class="map-placeholder">
                        <iframe
                            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d109412.5773928127!2d-6.9595436!3d30.9335434!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xdbbafc3d1c3b2a1%3A0x5c8c93d3536bc3a9!2sOuarzazate!5e0!3m2!1sen!2sma!4v1707644000000!5m2!1sen!2sma"
                            width="100%"
                            height="250"
                            style="border:0;"
                            allowfullscreen=""
                            loading="lazy">
                        </iframe>
                    </div>
                </div>
            </aside>

            <!-- Contact Form Column -->
            <main class="contact-form-column">
                <div class="form-wrapper card slide-left">
                    <form *ngIf="!submitted" (ngSubmit)="onSubmit()" #contactForm="ngForm" class="contact-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="name">Full Name</label>
                                <div class="input-wrapper">
                                    <input type="text" id="name" name="name" [(ngModel)]="formData.name" required
                                        #name="ngModel" [class.error]="name.invalid && name.touched"
                                        placeholder="John Doe">
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="email">Email Address</label>
                                <div class="input-wrapper">
                                    <input type="email" id="email" name="email" [(ngModel)]="formData.email" required
                                        email #email="ngModel" [class.error]="email.invalid && email.touched"
                                        placeholder="john@example.com">
                                </div>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="phone">Phone Number</label>
                                <div class="input-wrapper">
                                    <input type="tel" id="phone" name="phone" [(ngModel)]="formData.phone"
                                        placeholder="+212 6...">
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="subject">Subject</label>
                                <div class="input-wrapper">
                                    <select id="subject" name="subject" [(ngModel)]="formData.subject">
                                        <option *ngFor="let s of subjects" [value]="s">{{s}}</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="message">Your Message</label>
                            <div class="input-wrapper">
                                <textarea id="message" name="message" [(ngModel)]="formData.message" required
                                    #message="ngModel" [class.error]="message.invalid && message.touched" rows="5"
                                    placeholder="How can we help you today?"></textarea>
                            </div>
                        </div>

                        <div class="error-toast" [class.show]="errorMessage">
                            {{errorMessage}}
                        </div>

                        <button type="submit" [disabled]="isSubmitting" class="btn main w-full">
                            <span *ngIf="!isSubmitting">Send Message</span>
                            <div *ngIf="isSubmitting" class="loader"></div>
                        </button>
                    </form>

                    <!-- Success Message UI -->
                    <div *ngIf="submitted" class="success-card fade-in">
                        <div class="success-animation">
                            <div class="check-container">
                                <div class="check-circle"></div>
                                <div class="check-stem"></div>
                                <div class="check-kick"></div>
                            </div>
                        </div>
                        <h3>Message Sent Successfully!</h3>
                        <p>We've received your inquiry and will reach out to you within 24 hours.</p>
                        <button (click)="resetForm()" class="btn ghost mt-lg">Send Another Message</button>
                    </div>
                </div>
            </main>
        </div>
    </div>
</div>
