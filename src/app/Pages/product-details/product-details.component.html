<div class="product-page">
    <!-- Breadcrumb -->
    <div class="breadcrumb">
        <a href="/" class="breadcrumb-link">Home</a>
        <span class="separator">›</span>
        <a href="/collection" class="breadcrumb-link">Products</a>
        <span class="separator">›</span>
        <span class="current" *ngIf="product">{{ product.name }}</span>
    </div>

    <div class="product-container" *ngIf="product; else loading">
        <!-- Product Gallery -->
        <div class="gallery-section">
            <div class="main-image">
                <img [src]="selectedImage || (product.images && product.images[0] || 'assets/placeholder.jpg')" 
                     [alt]="product.name" 
                     class="product-img"
                     [class.color-transition]="isTransitioning">
            </div>
            
            <!-- Thumbnails -->
            <div class="thumbnails" *ngIf="product.images && product.images.length > 1">
                <div class="thumbnail" 
                     *ngFor="let image of product.images; let i = index" 
                     [class.active]="selectedImage === image"
                     (click)="selectImage(image)">
                    <img [src]="image" [alt]="'Image ' + (i + 1)">
                </div>
            </div>
        </div>

        <!-- Product Info -->
        <div class="info-section">
            <!-- Product Header -->
            <div class="product-header">
                <h1 class="product-title">{{ product.name }}</h1>
                <div class="rating-section">
                    <div class="stars">
                        <span class="star" *ngFor="let star of getStars()">★</span>
                    </div>
                    <span class="rating-text">{{ product.rating || 4.5 }} ({{ product.reviews || 128 }} reviews)</span>
                </div>
                <div class="price-section">
                    <span class="price">{{ product.price }} MAD</span>
                </div>
            </div>

            <!-- Product Options -->
            <div class="options-section">
                <!-- Color Selection -->
                <div class="option-group" *ngIf="product.colors && product.colors.length > 0">
                    <h3 class="option-title">Color</h3>
                    <div class="color-options">
                        <div class="color-swatch" 
                             *ngFor="let color of product.colors" 
                             [class.active]="selectedColor === color"
                             [style.background-color]="getColorCode(color)"
                             (click)="selectColor(color)"
                             [title]="color">
                        </div>
                    </div>
                </div>

                <!-- Quantity Selection -->
                <div class="option-group">
                    <h3 class="option-title">Quantity</h3>
                    <div class="quantity-selector">
                        <button class="qty-btn" (click)="updateQuantity(-1)" [disabled]="quantity <= 1">−</button>
                        <input type="number" [(ngModel)]="quantity" min="1" max="10" class="qty-input">
                        <button class="qty-btn" (click)="updateQuantity(1)">+</button>
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="action-section">
                <button class="btn primary" (click)="onAddToCart()">
                    <span class="btn-text">Add to Cart</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Loading State -->
    <ng-template #loading>
        <div class="loading-container">
            <div class="loading-spinner"></div>
            <p>Loading product...</p>
        </div>
    </ng-template>
</div>
