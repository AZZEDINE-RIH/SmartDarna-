<div class="admin-container">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="logo">
      <h2>SmartDarna</h2>
    </div>
    <nav class="nav-menu">
      <a routerLink="overview" routerLinkActive="active" class="nav-item">
        <i class="icon-dashboard"></i> Dashboard
      </a>
      <a routerLink="users" routerLinkActive="active" class="nav-item">
        <i class="icon-users"></i> Users
      </a>
      <a routerLink="sellers" routerLinkActive="active" class="nav-item">
        <i class="icon-sellers"></i> Sellers
      </a>
      <a routerLink="products" routerLinkActive="active" class="nav-item">
        <i class="icon-products"></i> Products
      </a>
      <a routerLink="orders" routerLinkActive="active" class="nav-item">
        <i class="icon-orders"></i> Orders
      </a>
      <a routerLink="settings" routerLinkActive="active" class="nav-item">
        <i class="icon-settings"></i> Settings
      </a>
    </nav>
    <div class="user-profile">
      <div class="avatar">{{ user?.name?.charAt(0) || 'A' }}</div>
      <div class="info">
        <p class="name">{{ user?.name || 'Admin' }}</p>
        <p class="role">Administrator</p>
      </div>
      <button (click)="logout()" class="logout-btn">
        Logout
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
