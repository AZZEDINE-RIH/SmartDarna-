<!-- Messages List View -->
<div *ngIf="!showDetails" class="mt-6 py-2 px-6 rounded-2xl">
  <div class="max-w-7xl mx-auto bg-white dark:bg-gray-800 rounded-2xl shadow-sm">

    <!-- ===================== TABS ===================== -->
    <div class="border-b border-gray-200 dark:border-gray-700">
      <div class="flex space-x-8 px-6 pt-4">

        <!-- ALL -->
        <button
          (click)="setActiveTab('all')"
          class="pb-3 border-b-2 font-medium"
          [ngClass]="activeTab === 'all'
            ? 'text-brand border-brand'
            : 'text-gray-600 dark:text-gray-300 border-transparent'">
          All Messages
        </button>

        <!-- UNREAD -->
        <button
          (click)="setActiveTab('unread')"
          class="pb-3 border-b-2"
          [ngClass]="activeTab === 'unread'
            ? 'text-brand border-brand'
            : 'text-gray-600 dark:text-gray-300 border-transparent'">
          Unread ({{ getUnreadCount() }})
        </button>

        <!-- ARCHIVED -->
        <button
          (click)="setActiveTab('archived')"
          class="pb-3 border-b-2"
          [ngClass]="activeTab === 'archived'
            ? 'text-brand border-brand'
            : 'text-gray-600 dark:text-gray-300 border-transparent'">
          Archived
        </button>

      </div>
    </div>

    <!-- ===================== TABLE ===================== -->
    <div class="overflow-x-auto">
      <table class="w-full">

        <thead>
          <tr
            class="border-b border-gray-200 dark:border-gray-700 text-xs text-gray-500 dark:text-gray-400 uppercase">
            <th class="w-12 px-6 py-4 text-left">
              <input type="checkbox"
                class="rounded border-gray-300 dark:border-gray-600 dark:bg-gray-700">
            </th>
            <th class="px-4 py-4 text-left font-medium">Customer</th>
            <th class="px-4 py-4 text-left font-medium">Subject & Message</th>
            <th class="px-4 py-4 text-left font-medium">Date</th>
            <th class="px-4 py-4 text-left font-medium">Status</th>
          </tr>
        </thead>

        <tbody>

          <tr
            *ngFor="let message of filteredMessages"
            (click)="onMessageClick(message)"
            class="border-b border-gray-100 dark:border-gray-700
                   hover:bg-gray-50 dark:hover:bg-gray-700/50
                   cursor-pointer">

            <!-- Checkbox -->
            <td class="px-6 py-4">
              <input
                type="checkbox"
                (click)="$event.stopPropagation()"
                class="rounded border-gray-300 dark:border-gray-600 dark:bg-gray-700">
            </td>

            <!-- Customer -->
            <td class="px-4 py-4">
              <div class="flex items-center space-x-3">
                <img
                  [src]="message.avatarUrl.replace('80', '40')"
                  [alt]="message.name"
                  class="w-10 h-10 rounded-full">

                <div>
                  <div class="font-medium text-gray-900 dark:text-white">
                    {{ message.name }}
                  </div>
                  <div class="text-sm text-gray-500 dark:text-gray-400">
                    {{ message.email }}
                  </div>
                </div>
              </div>
            </td>

            <!-- Subject -->
            <td class="px-4 py-4">
              <div>
                <div
                  class="font-medium text-gray-900 dark:text-white"
                  [class.font-bold]="!message.isRead">
                  {{ message.subject }}
                </div>

                <div class="text-sm text-gray-500 dark:text-gray-400">
                  {{ message.preview }}
                </div>
              </div>
            </td>

            <!-- Date -->
            <td class="px-4 py-4">
              <div class="text-sm text-gray-600 dark:text-gray-300">
                {{ message.relativeTime }}
              </div>
              <div
                class="text-xs text-gray-400 dark:text-gray-500"
                *ngIf="message.relativeTime !== message.date">
                {{ message.time }}
              </div>
            </td>

            <!-- Status -->
            <td class="px-4 py-4">
              <span class="inline-flex items-center space-x-2">

                <span
                  class="w-2 h-2 rounded-full"
                  [ngClass]="{
                    'bg-[#60CED6]': !message.isRead,
                    'bg-green-400': message.isRead && !message.isArchived,
                    'bg-gray-400': message.isArchived
                  }">
                </span>

                <span class="text-xs text-gray-500 dark:text-gray-400">
                  {{
                    message.isArchived
                      ? 'Archived'
                      : message.isRead
                        ? 'Read'
                        : 'Unread'
                  }}
                </span>

              </span>
            </td>

          </tr>

        </tbody>
      </table>
    </div>

    <!-- ===================== FOOTER ===================== -->
    <div
      class="px-6 py-4 border-t border-gray-200 dark:border-gray-700
             flex items-center justify-between">

      <div class="text-sm text-gray-600 dark:text-gray-400">
        Showing {{ filteredMessages.length }} messages
      </div>

      <div class="flex items-center space-x-2">
        <button
          class="w-8 h-8 flex items-center justify-center rounded
                 hover:bg-gray-100 dark:hover:bg-gray-700
                 text-gray-600 dark:text-gray-300">
          ‹
        </button>

        <button
          class="w-8 h-8 flex items-center justify-center rounded
                 bg-[#60CED6] text-white">
          1
        </button>

        <button
          class="w-8 h-8 flex items-center justify-center rounded
                 hover:bg-gray-100 dark:hover:bg-gray-700
                 text-gray-600 dark:text-gray-300">
          2
        </button>

        <button
          class="w-8 h-8 flex items-center justify-center rounded
                 hover:bg-gray-100 dark:hover:bg-gray-700
                 text-gray-600 dark:text-gray-300">
          ›
        </button>
      </div>

    </div>
  </div>
</div>

<!-- ===================== DETAILS VIEW ===================== -->
<div *ngIf="showDetails && selectedMessage">
  <app-details
    [message]="selectedMessage!"
    (backToList)="onBackToList()">
  </app-details>
</div>
