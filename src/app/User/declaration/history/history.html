<div class="mt-5 rounded-2xl">
  <div
    class="max-w-7xl mx-auto rounded-2xl shadow-sm overflow-hidden transition-colors duration-300"
    [ngClass]="isDarkMode ? 'bg-gray-800' : 'bg-white'"
  >
    <!-- Header -->
    <div class="p-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
      <div>
        <h2
          class="text-xl font-bold"
          [ngClass]="isDarkMode ? 'text-white' : 'text-gray-800'"
        >
          Document History
        </h2>
        <p
          class="text-sm"
          [ngClass]="isDarkMode ? 'text-gray-400' : 'text-gray-500'"
        >
          Manage and track your legal and tax submissions.
        </p>
      </div>

      <div class="flex items-center gap-3">
        <!-- Search -->
        <div class="relative">
          <span
            class="absolute inset-y-0 left-3 flex items-center"
            [ngClass]="isDarkMode ? 'text-gray-500' : 'text-gray-400'"
          >
            <svg
              class="w-4 h-4"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
              ></path>
            </svg>
          </span>
          <input
            type="text"
            placeholder="Search ID or Type..."
            class="pl-10 pr-4 py-2 rounded-lg text-sm w-64 transition-colors duration-200 focus:ring-2 focus:ring-[#60CED6]"
            [ngClass]="
              isDarkMode
                ? 'bg-gray-800 text-gray-200 placeholder-gray-500'
                : 'bg-gray-100 text-gray-700'
            "
          />
        </div>

        <!-- Filter Button -->
        <button
          class="flex items-center gap-2 px-4 py-2 border rounded-lg text-sm font-medium transition-colors"
          [ngClass]="
            isDarkMode
              ? 'border-gray-700 text-gray-300 hover:bg-gray-800'
              : 'border-gray-200 text-gray-600 hover:bg-gray-50'
          "
        >
          <svg
            class="w-4 h-4"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path d="M3 4h18M6 10h12M9 16h6"></path>
          </svg>
          Filters
        </button>
      </div>
    </div>

    <!-- Table -->
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr
            class="text-xs font-semibold uppercase tracking-wider border-y"
            [ngClass]="
              isDarkMode
                ? 'text-gray-500 border-gray-700'
                : 'text-gray-400 border-gray-100'
            "
          >
            <th class="px-6 py-4">Declaration ID</th>
            <th class="px-6 py-4">Type</th>
            <th class="px-6 py-4">Period</th>
            <th class="px-6 py-4">Submission Date</th>
            <th class="px-6 py-4">Status</th>
            <th class="px-6 py-4 text-right">Actions</th>
          </tr>
        </thead>

        <tbody
          [ngClass]="isDarkMode ? 'divide-gray-800' : 'divide-gray-100'"
          class="divide-y"
        >
          <tr
            *ngFor="let doc of historyRecords"
            class="transition-colors"
            [ngClass]="isDarkMode ? 'hover:bg-gray-800' : 'hover:bg-gray-50'"
          >
            <td
              class="px-6 py-5 font-bold text-sm"
              [ngClass]="isDarkMode ? 'text-gray-200' : 'text-gray-800'"
            >
              {{ doc.id }}
            </td>

            <td class="px-6 py-5">
              <div class="flex items-center gap-3">
                <span
                  class="p-2 rounded-lg text-lg"
                  [ngClass]="
                    isDarkMode
                      ? 'bg-cyan-900/30 text-[#60CED6]'
                      : 'bg-cyan-50 text-[#60CED6]'
                  "
                >
                  📄
                </span>
                <span
                  class="text-sm font-medium"
                  [ngClass]="isDarkMode ? 'text-gray-300' : 'text-gray-700'"
                >
                  {{ doc.type }}
                </span>
              </div>
            </td>

            <td
              class="px-6 py-5 text-sm font-medium"
              [ngClass]="isDarkMode ? 'text-gray-500' : 'text-gray-400'"
            >
              {{ doc.period }}
            </td>

            <td
              class="px-6 py-5 text-sm font-medium"
              [ngClass]="isDarkMode ? 'text-gray-500' : 'text-gray-400'"
            >
              {{ doc.submissionDate }}
            </td>

            <td class="px-6 py-5">
              <span
                class="px-3 py-1 rounded-full text-xs font-bold flex items-center w-fit gap-1"
                [ngClass]="{
                  'bg-green-100 text-green-600': !isDarkMode && doc.status === 'Submitted',
                  'bg-green-900/30 text-green-400': isDarkMode && doc.status === 'Submitted',

                  'bg-orange-100 text-orange-600': !isDarkMode && doc.status === 'Pending',
                  'bg-orange-900/30 text-orange-400': isDarkMode && doc.status === 'Pending',

                  'bg-red-50 text-red-500': !isDarkMode && doc.status === 'Rejected',
                  'bg-red-900/30 text-red-400': isDarkMode && doc.status === 'Rejected'
                }"
              >
                <span class="w-1.5 h-1.5 rounded-full bg-current"></span>
                {{ doc.status }}
              </span>
            </td>

            <td class="px-6 py-5 text-right">
              <div
                *ngIf="doc.status === 'Submitted'"
                class="flex justify-end gap-4"
                [ngClass]="isDarkMode ? 'text-gray-500' : 'text-gray-400'"
              >
                <button class="hover:text-[#60CED6]">👁️</button>
                <button class="hover:text-[#60CED6]">📥</button>
              </div>

              <div *ngIf="doc.status !== 'Submitted'" class="flex flex-col items-end">
                <span
                  *ngIf="doc.statusReason"
                  class="text-[10px] font-bold uppercase mb-1"
                  [ngClass]="isDarkMode ? 'text-red-400' : 'text-red-500'"
                >
                  {{ doc.statusReason }}
                </span>
                <button class="text-[#60CED6] font-bold text-sm hover:underline italic">
                  {{ doc.actionLabel }}
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div
      class="p-6 border-t flex items-center justify-between text-sm font-medium"
      [ngClass]="
        isDarkMode
          ? 'border-gray-700 text-gray-500'
          : 'border-gray-100 text-gray-400'
      "
    >
      <p>Showing 5 of 12 declarations recorded in 2023</p>

      <div class="flex items-center gap-2">
        <button
          class="px-3 py-1 border rounded transition-colors"
          [ngClass]="
            isDarkMode
              ? 'border-gray-700 hover:bg-gray-800'
              : 'border-gray-200 hover:bg-gray-50'
          "
        >
          Previous
        </button>

        <button class="px-3 py-1 bg-[#60CED6] text-white rounded">1</button>

        <button
          class="px-3 py-1 rounded transition-colors"
          [ngClass]="isDarkMode ? 'hover:bg-gray-800' : 'hover:bg-gray-50'"
        >
          2
        </button>

        <button
          class="px-3 py-1 rounded transition-colors"
          [ngClass]="isDarkMode ? 'hover:bg-gray-800' : 'hover:bg-gray-50'"
        >
          3
        </button>

        <button
          class="px-3 py-1 border rounded transition-colors"
          [ngClass]="
            isDarkMode
              ? 'border-gray-700 hover:bg-gray-800'
              : 'border-gray-200 hover:bg-gray-50'
          "
        >
          Next
        </button>
      </div>
    </div>
  </div>
</div>
