<div class="mt-5">
  <div class="max-w-7xl mx-auto bg-white rounded-2xl shadow-sm overflow-hidden">
    
    <div class="p-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
      <div>
        <h2 class="text-xl font-bold text-gray-800">Document History</h2>
        <p class="text-sm text-gray-500">Manage and track your legal and tax submissions.</p>
      </div>
      <div class="flex items-center gap-3">
        <div class="relative">
          <span class="absolute inset-y-0 left-3 flex items-center text-gray-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
          </span>
          <input type="text" placeholder="Search ID or Type..." class="pl-10 pr-4 py-2 bg-gray-100 border-none rounded-lg text-sm focus:ring-2 focus:ring-cyan-500 w-64">
        </div>
        <button class="flex items-center gap-2 px-4 py-2 border rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 4h18M6 10h12M9 16h6"></path></svg>
          Filters
        </button>
      </div>
    </div>

    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="text-xs font-semibold text-gray-400 uppercase tracking-wider border-y border-gray-100">
            <th class="px-6 py-4">Declaration ID</th>
            <th class="px-6 py-4">Type</th>
            <th class="px-6 py-4">Period</th>
            <th class="px-6 py-4">Submission Date</th>
            <th class="px-6 py-4">Status</th>
            <th class="px-6 py-4 text-right">Actions</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-100">
          <tr *ngFor="let doc of historyRecords" class="hover:bg-gray-50 transition-colors">
            <td class="px-6 py-5 font-bold text-gray-800 text-sm">{{ doc.id }}</td>
            <td class="px-6 py-5">
              <div class="flex items-center gap-3">
                <span class="p-2 bg-cyan-50 text-cyan-600 rounded-lg text-lg">📄</span>
                <span class="text-sm font-medium text-gray-700">{{ doc.type }}</span>
              </div>
            </td>
            <td class="px-6 py-5 text-sm text-gray-400 font-medium">{{ doc.period }}</td>
            <td class="px-6 py-5 text-sm text-gray-400 font-medium">{{ doc.submissionDate }}</td>
            <td class="px-6 py-5">
              <span [ngClass]="{
                'bg-green-100 text-green-600': doc.status === 'Submitted',
                'bg-orange-100 text-orange-600': doc.status === 'Pending',
                'bg-red-50 text-red-500': doc.status === 'Rejected'
              }" class="px-3 py-1 rounded-full text-xs font-bold flex items-center w-fit gap-1">
                <span class="w-1.5 h-1.5 rounded-full bg-current"></span>
                {{ doc.status }}
              </span>
            </td>
            <td class="px-6 py-5 text-right">
              <div *ngIf="doc.status === 'Submitted'" class="flex justify-end gap-4 text-gray-400">
                <button class="hover:text-cyan-600">👁️</button>
                <button class="hover:text-cyan-600">📥</button>
              </div>
              <div *ngIf="doc.status !== 'Submitted'" class="flex flex-col items-end">
                <span *ngIf="doc.statusReason" class="text-[10px] text-red-500 font-bold uppercase mb-1">{{ doc.statusReason }}</span>
                <button class="text-cyan-500 font-bold text-sm hover:underline italic">
                  {{ doc.actionLabel }}
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="p-6 border-t border-gray-100 flex items-center justify-between text-sm text-gray-400 font-medium">
      <p>Showing 5 of 12 declarations recorded in 2023</p>
      <div class="flex items-center gap-2">
        <button class="px-3 py-1 border rounded hover:bg-gray-50">Previous</button>
        <button class="px-3 py-1 bg-cyan-500 text-white rounded">1</button>
        <button class="px-3 py-1 hover:bg-gray-50 rounded">2</button>
        <button class="px-3 py-1 hover:bg-gray-50 rounded">3</button>
        <button class="px-3 py-1 border rounded hover:bg-gray-50">Next</button>
      </div>
    </div>
  </div>
</div>
