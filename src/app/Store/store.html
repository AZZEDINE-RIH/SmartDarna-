<div class="flex min-h-screen bg-[#F8FAFB] font-sans p-8 gap-10">

  <!-- ================= SIDEBAR ================= -->
  <aside class="w-72 bg-white p-6 rounded-xl shadow-sm border border-gray-50
                flex flex-col gap-8">

    <!-- Categories -->
    <div>
      <h3 class="text-gray-700 font-bold mb-4 flex gap-2">
        Categories
      </h3>

      <button
        *ngFor="let cat of categories"
        (click)="selectedCategory.set(cat.name); currentPage = 1"
        [class]="selectedCategory() === cat.name
          ? 'w-full flex items-center gap-3 p-2 rounded-lg border-none text-sm font-bold bg-[#E0F7F4] text-[#60CED6]'
          : 'w-full flex items-center gap-3 p-2 rounded-lg border-none text-sm font-bold bg-transparent text-[#1F2937] hover:text-[#60CED6]'">
        <!-- Icon -->
        <span *ngIf="cat.icon === 'grid'" class="w-5 h-5">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 01- - - - - - - - - - -" />
          </svg>
        </span>
        <span *ngIf="cat.icon === 'circle'" class="w-5 h-5">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 4" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 9c-4,4,-4,8,0,16s4,4,8,4s8,-4,8,-8s-4,-8,-8,-8s-8,4,-8,8z" />
          </svg>
        </span>
        <span *ngIf="cat.icon === 'devices'" class="w-5 h-5">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 17.25h6m-6 3h6M8.25 6h7.5A2.25 2.25 0 0118 8.25v6A2.25 2.25 0 0115.75 16.5h-7.5A2.25 2.25 0 016 14.25v-6A2.25 2.25 0 018.25 6z" />
          </svg>
        </span>
        <span *ngIf="cat.icon === 'thermostat'" class="w-5 h-5">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3a3 3 0 00-3 3v7.3a4.5 4.5 0 106 0V6a3 3 0 00-3-3z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 14.25a1.5 1.5 0 011.5 1.5 1.5 1.5 0 11-3 0 1.5 1.5 0 011.5-1.5z" />
          </svg>
        </span>
        <span *ngIf="cat.icon === 'notifications'" class="w-5 h-5">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.31 6.022 23.848 23.848 0 005.454 1.31m5.713 0a3 3 0 01-5.714 0m5.714 0H9.143" />
          </svg>
        </span>
        <span *ngIf="cat.icon === 'lock'" class="w-5 h-5">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V7.875a4.5 4.5 0 10-9 0V10.5m-.75 0h10.5A2.25 2.25 0 0119.5 12.75v6A2.25 2.25 0 0117.25 21H6.75A2.25 2.25 0 014.5 18.75v-6A2.25 2.25 0 016.75 10.5z" />
          </svg>
        </span>
        <!-- Category Name -->
        <span>{{ cat.name }}</span>
      </button>
    </div>

    <!-- Price -->
    <div>
      <h3 class="font-bold mb-4 text-gray-700">Price</h3>

      <input
        type="range"
        min="0"
        [max]="maxPrice"
        [ngModel]="selectedPrice()"
        (ngModelChange)="selectedPrice.set($event)"
        class="w-full accent-[#60CED6]">

      <div class="flex justify-between text-sm font-bold text-gray-700 mt-2">
        <span>{{ minPrice }} DH</span>
        <span>{{ selectedPrice() }} DH</span>
      </div>
    </div>

    <!-- Brands -->
    <div>
      <h3 class="font-bold mb-4 text-gray-700">Brands</h3>

      <label *ngFor="let b of brands"
             [class]="b.selected 
               ? 'flex items-center gap-3 p-2 rounded-lg text-sm bg-[#E0F7F4] text-[#60CED6] hover:text-[#60CED6] cursor-pointer'
               : 'flex items-center gap-3 p-2 rounded-lg text-sm text-gray-700 hover:text-[#60CED6] cursor-pointer'">
        <input type="checkbox" [(ngModel)]="b.selected" class="accent-[#60CED6] w-5 h-5">
        {{ b.name }}
      </label>
    </div>

    <!-- Clear -->
    <button
      (click)="clearFilters()"
      class="bg-[#60CED6] hover:bg-[#60CED6] text-white py-3 rounded-xl font-bold">
      Clear Filters
    </button>

  </aside>

  <!-- ================= PRODUCTS ================= -->
  <main class="flex-1 flex flex-col gap-8">

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">

      <div *ngFor="let p of paginatedProducts"
           class="group bg-white rounded-[2rem] p-5 shadow-sm border border-slate-100
                  hover:-translate-y-3 hover:shadow-2xl transition-all">

        <!-- Image -->
        <div class="h-64 bg-slate-100 rounded-[1.5rem] overflow-hidden mb-5">
          <img [src]="p.image"
               class="w-full h-full object-cover
                      group-hover:scale-110 transition">
        </div>

        <!-- Info -->
        <span class="px-3 py-1 bg-blue-50 text-[#60CED6]
                     text-[10px]  rounded-full">
          {{ p.category }}
        </span>

        <h4 class="text-xl  mt-3">
          {{ p.name }}
        </h4>

        <div class="flex justify-between items-center mt-4">

          <div>
            <div class="text-xl">
              {{ p.price }} DH
            </div>

            <!-- stars -->
            <div class="flex text-amber-400 mt-1">
              <span *ngFor="let filled of getStars(p.rating)">
                <svg class="w-4 h-4"
                     viewBox="0 0 24 24"
                     fill="currentColor"
                     [class.text-slate-200]="!filled">
                  <path
                    d="M12 2l3 7h7l-5.5 4.5L18 21
                       12 17 6 21l1.5-7.5L2 9h7z" />
                </svg>
              </span>
            </div>
          </div>

          <!-- add -->
          <button
  class="group relative overflow-hidden
         bg-gradient-to-br from-[#60CED6] to-teal-300
         text-white h-14 w-14 rounded-2xl
         shadow-lg shadow-gray-200
         flex items-center justify-center
         transition-all duration-300
         hover:brightness-110 active:scale-90">

  <!-- ICON PANIER -->
  <svg
    xmlns="http://www.w3.org/2000/svg"
    fill="none"
    viewBox="0 0 24 24"
    stroke-width="2.2"
    stroke="currentColor"
    class="w-6 h-6 transition-transform duration-300 group-hover:scale-110">

    <path stroke-linecap="round" stroke-linejoin="round"
      d="M2.25 3h1.386c.51 0 .96.343
         1.087.835l.383 1.437M7.5 14.25a3
         3 0 100 6 3 3 0 000-6zm9
         0a3 3 0 100 6 3 3 0 000-6zM5.106
         5.272h13.188c.927 0 1.6.89
         1.33 1.776l-1.89 6.3a1.5
         1.5 0 01-1.437 1.074H8.251a1.5
         1.5 0 01-1.437-1.074L4.106
         3.835" />
  </svg>
</button>


        </div>
      </div>
    </div>

    <!-- PAGINATION -->
    <div class="flex justify-center mt-10 space-x-2">
      <button
        (click)="changePage(currentPage - 1)"
        [disabled]="currentPage === 1"
        class="px-3 py-1 bg-[#60CED6] rounded text-black hover:text-[#60CED6] 
        disabled:opacity-50 disabled:cursor-not-allowed">
        ‹
      </button>

      <button
        *ngFor="let p of totalPagesArray()"
        (click)="changePage(p)"
        [class.bg-white]="p === currentPage"
        class="px-3 py-1 rounded text-black hover:text-black hover:bg-[#60CED6]">
        {{ p }}
      </button>

      <button
        (click)="changePage(currentPage + 1)"
        [disabled]="currentPage === totalPages"
        class="px-3 py-1 bg-[#60CED6] rounded text-black hover:text-[#60CED6] disabled:opacity-50 disabled:cursor-not-allowed">
        ›
      </button>
    </div>

  </main>
</div>
