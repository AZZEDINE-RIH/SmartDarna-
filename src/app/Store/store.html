<div class="flex min-h-screen bg-[#F8FAFB] font-sans p-8 gap-10">

  <!-- ================= SIDEBAR ================= -->
  <aside class="w-72 bg-white p-6 rounded-xl shadow-sm border border-gray-50
                flex flex-col gap-8">

    <!-- Categories -->
    <div>
      <h3 class="text-gray-700 font-bold mb-4 flex gap-2">
        ▲ Categories
      </h3>

      <button
        *ngFor="let cat of categories"
        (click)="selectedCategory.set(cat.name); currentPage = 1"
        [class]="selectedCategory() === cat.name
          ? 'w-full p-2 rounded-lg bg-teal-50 text-teal-600'
          : 'w-full p-2 rounded-lg text-gray-500 hover:bg-gray-50'">
        {{ cat.name }}
      </button>
    </div>

    <!-- Price -->
    <div>
      <h3 class="font-bold mb-4">💵 Price</h3>

      <input
        type="range"
        min="0"
        [max]="maxPrice"
        [ngModel]="selectedPrice()"
        (ngModelChange)="selectedPrice.set($event)"
        class="w-full accent-blue-500">

      <div class="flex justify-between text-xs text-gray-400 mt-2">
        <span>{{ minPrice }} DH</span>
        <span>{{ selectedPrice() }} DH</span>
      </div>
    </div>

    <!-- Brands -->
    <div>
      <h3 class="font-bold mb-4">🔳 Brands</h3>

      <label *ngFor="let b of brands"
             class="flex items-center gap-3 text-sm text-gray-600">
        <input type="checkbox" [(ngModel)]="b.selected">
        {{ b.name }}
      </label>
    </div>

    <!-- Clear -->
    <button
      (click)="clearFilters()"
      class="bg-teal-500 hover:bg-teal-600 text-white py-3 rounded-xl font-bold">
      Clear Filters
    </button>

  </aside>

  <!-- ================= PRODUCTS ================= -->
  <main class="flex-1 flex flex-col gap-8">

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">

      <div *ngFor="let p of paginatedProducts"
           class="group bg-white rounded-[2rem] p-5 shadow-sm border border-slate-100
                  hover:-translate-y-3 hover:shadow-2xl transition-all">

        <!-- Image -->
        <div class="h-64 bg-slate-100 rounded-[1.5rem] overflow-hidden mb-5">
          <img [src]="p.image"
               class="w-full h-full object-cover
                      group-hover:scale-110 transition">
        </div>

        <!-- Info -->
        <span class="px-3 py-1 bg-blue-50 text-blue-600
                     text-[10px] font-bold rounded-full">
          {{ p.category }}
        </span>

        <h3 class="text-xl font-bold mt-3">
          {{ p.name }}
        </h3>

        <div class="flex justify-between items-center mt-4">

          <div>
            <div class="text-2xl font-black">
              {{ p.price }} DH
            </div>

            <!-- stars -->
            <div class="flex text-amber-400 mt-1">
              <span *ngFor="let filled of getStars(p.rating)">
                <svg class="w-4 h-4"
                     viewBox="0 0 24 24"
                     fill="currentColor"
                     [class.text-slate-200]="!filled">
                  <path
                    d="M12 2l3 7h7l-5.5 4.5L18 21
                       12 17 6 21l1.5-7.5L2 9h7z" />
                </svg>
              </span>
            </div>
          </div>

          <!-- add -->
          <button
  class="group relative overflow-hidden
         bg-gradient-to-br from-gray-300 to-white
         text-blue-800 h-14 w-14 rounded-2xl
         shadow-lg shadow-gray-200
         flex items-center justify-center
         transition-all duration-300
         hover:brightness-110 active:scale-90">

  <!-- ICON PANIER -->
  <svg
    xmlns="http://www.w3.org/2000/svg"
    fill="none"
    viewBox="0 0 24 24"
    stroke-width="2.2"
    stroke="currentColor"
    class="w-6 h-6 transition-transform duration-300 group-hover:scale-110">

    <path stroke-linecap="round" stroke-linejoin="round"
      d="M2.25 3h1.386c.51 0 .96.343
         1.087.835l.383 1.437M7.5 14.25a3
         3 0 100 6 3 3 0 000-6zm9
         0a3 3 0 100 6 3 3 0 000-6zM5.106
         5.272h13.188c.927 0 1.6.89
         1.33 1.776l-1.89 6.3a1.5
         1.5 0 01-1.437 1.074H8.251a1.5
         1.5 0 01-1.437-1.074L4.106
         3.835" />
  </svg>
</button>


        </div>
      </div>
    </div>

    <!-- PAGINATION -->
    <div class="flex justify-center mt-10 space-x-2">
      <button
        (click)="changePage(currentPage - 1)"
        [disabled]="currentPage === 1"
        class="px-3 py-1 bg-gray-400 rounded text-gray-500">
        ‹
      </button>

      <button
        *ngFor="let p of totalPagesArray()"
        (click)="changePage(p)"
        [class.bg-white]="p === currentPage"
        class="px-3 py-1 rounded text-black hover:text-gray-500 hover:bg-gray-200">
        {{ p }}
      </button>

      <button
        (click)="changePage(currentPage + 1)"
        [disabled]="currentPage === totalPages"
        class="px-3 py-1 bg-gray-400 rounded text-gray-500">
        ›
      </button>
    </div>

  </main>
</div>
