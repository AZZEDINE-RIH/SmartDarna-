<nav class="navbar">
  <div class="navbar-container">

    <!-- Logo -->
    <a routerLink="/" class="navbar-logo">
      <img src="assets/logo dark without bg (1).png" alt="SmartDarna" class="nav-logo-img">
      <span class="logo-text">Smart<span class="logo-accent">D</span>arna</span>
    </a>

    <!-- Links -->
    <ul class="navbar-links">
      <li><a routerLink="/" class="nav-link">Home</a></li>

      <li><a routerLink="/about" class="nav-link">About</a></li>
      <li><a routerLink="/team" class="nav-link">Team</a></li>

      <li><a routerLink="/services" class="nav-link">Services</a></li>
      <li><a routerLink="/collection" class="nav-link">Collection</a></li>

      <li><a routerLink="/contact" class="nav-link">Contact</a></li>
    </ul>

    <!-- Actions -->
    <div class="navbar-actions">

      <!-- Cart -->
      <div class="cart-wrapper">
        <a routerLink="/cart" class="cart-button">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
        </a>

        <!-- Badge -->
        <span *ngIf="cartCount > 0" class="cart-badge">
          {{ cartCount }}
        </span>
      </div>

      <!-- Login -->
      <a routerLink="/login" class="login-button" aria-label="Login">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
          <polyline points="10,17 15,12 10,7"></polyline>
          <line x1="15" y1="12" x2="3" y2="12"></line>
        </svg>
      </a>

      <!-- Dark Mode Toggle (Switch) -->
      <button (click)="toggleDarkMode()" class="theme-toggle" [class.dark]="isDarkMode" aria-label="Toggle dark mode">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" class="sun-icon"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" class="moon-icon"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>

    </div>

  </div>
</nav>
