<div class="auth-container">
  <div class="swap-shell" #shell>
    <div class="card-stack">
      <div class="auth-card" #loginCard [attr.aria-hidden]="mode !== 'login'">
        <button class="swap-tab" type="button" *ngIf="mode === 'login'" (click)="goTo('register')">SIGN UP</button>

        <div class="auth-header">
          <h2>Welcome Back</h2>
          <p>Sign in to your account</p>
        </div>

        <form (ngSubmit)="submitLogin()" class="auth-form">
          <div *ngIf="errorMessage && mode === 'login'" class="error-message">{{ errorMessage }}</div>

          <div class="form-group">
            <label for="loginEmail">Email</label>
            <input
              id="loginEmail"
              type="email"
              [(ngModel)]="loginEmail"
              name="loginEmail"
              required
              placeholder="Enter your email"
              class="form-control"
            />
          </div>

          <div class="form-group">
            <label for="loginPassword">Password</label>
            <input
              id="loginPassword"
              type="password"
              [(ngModel)]="loginPassword"
              name="loginPassword"
              required
              placeholder="Enter your password"
              class="form-control"
            />
          </div>

          <button type="submit" class="btn btn-primary btn-block" [disabled]="isLoading || !loginEmail || !loginPassword">
            <span *ngIf="!isLoading">Log In</span>
            <span *ngIf="isLoading">Logging In...</span>
          </button>
        </form>

        <div class="auth-divider">
          <span>OR</span>
        </div>

        <button type="button" (click)="signInWithGithub()" class="btn btn-github btn-block" [disabled]="isLoading">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
          </svg>
          Continue with GitHub
        </button>
      </div>

      <div class="auth-card" #registerCard [attr.aria-hidden]="mode !== 'register'">
        <button class="swap-tab" type="button" *ngIf="mode === 'register'" (click)="goTo('login')">LOG IN</button>

        <div class="auth-header">
          <h2>Create Account</h2>
          <p>Join our platform today</p>
        </div>

        <form (ngSubmit)="submitRegister()" class="auth-form">
          <div *ngIf="successMessage && mode === 'register'" class="success-message">{{ successMessage }}</div>
          <div *ngIf="errorMessage && mode === 'register'" class="error-message">{{ errorMessage }}</div>

          <div class="form-group">
            <label for="fullName">Full Name</label>
            <input
              id="fullName"
              type="text"
              [(ngModel)]="registerData.name"
              name="fullName"
              required
              placeholder="Enter your full name"
              class="form-control"
            />
          </div>

          <div class="form-group">
            <label for="regEmail">Email</label>
            <input
              id="regEmail"
              type="email"
              [(ngModel)]="registerData.email"
              name="regEmail"
              required
              placeholder="Enter your email"
              class="form-control"
            />
          </div>

          <div class="form-group">
            <label for="regRole">Account Type</label>
            <select
              id="regRole"
              [(ngModel)]="registerData.role"
              name="regRole"
              class="form-control"
            >
              <option value="user">Customer</option>
              <option value="seller">Seller</option>
              <option value="admin">Admin</option>
            </select>
          </div>

          <div class="form-group">
            <label for="regPassword">Password</label>
            <input
              id="regPassword"
              type="password"
              [(ngModel)]="registerData.password"
              name="regPassword"
              required
              placeholder="Enter your password (min 6 characters)"
              class="form-control"
            />
          </div>

          <div class="form-group">
            <label for="regConfirm">Confirm Password</label>
            <input
              id="regConfirm"
              type="password"
              [(ngModel)]="confirmPassword"
              name="regConfirm"
              required
              placeholder="Confirm your password"
              class="form-control"
            />
            <div *ngIf="confirmPassword && registerData.password !== confirmPassword" class="password-mismatch">
              Passwords do not match
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-block" [disabled]="isLoading || !isFormValid">
            <span *ngIf="!isLoading">Sign Up</span>
            <span *ngIf="isLoading">Creating Account...</span>
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
